services:
  - type: web
    name: gestionmomo-api
    runtime: node
    region: frankfurt        # le plus proche de l'Afrique de l'Ouest disponible
    plan: free               # passe à "starter" si tu as besoin du disque WhatsApp
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health

    # ── Variables d'environnement ─────────────────────────────────────────────
    # Les valeurs marquées "sync: false" sont à renseigner manuellement
    # dans le dashboard Render (Settings → Environment) — jamais dans ce fichier.
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000            # Render assigne ce port par défaut

      # MongoDB Atlas — à renseigner dans le dashboard
      - key: MONGODB_URI
        sync: false

      # JWT
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      # CORS — mets ici toutes tes URLs frontend séparées par des virgules
      # ex: https://gestionmomo.onrender.com,https://ton-site.com
      - key: CORS_ORIGINS
        sync: false

      # Email SMTP (optionnel — le service démarre sans)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: GestionMoMo
      - key: SMTP_FROM_EMAIL
        sync: false

      # MTN MoMo API
      - key: MOMO_BASE_URL
        value: https://sandbox.momodeveloper.mtn.com
      - key: MOMO_ENVIRONMENT
        value: sandbox
      - key: MOMO_COLLECTION_PRIMARY_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_PRIMARY_KEY
        sync: false
      - key: MOMO_REMITTANCE_PRIMARY_KEY
        sync: false
      # Cette URL doit pointer vers ton service Render une fois déployé
      # ex: https://gestionmomo-api.onrender.com/api/momo/callback
      - key: MOMO_CALLBACK_URL
        sync: false

      # WhatsApp — DÉSACTIVÉ au premier déploiement (pas de QR code possible en cloud)
      # Pour l'activer : passe au plan "starter", ajoute un Disk Render,
      # puis mets WHATSAPP_ENABLED=true et redémarre le service.
      - key: WHATSAPP_ENABLED
        value: "false"

      # Super Admin initial (créé automatiquement au 1er démarrage si absent)
      - key: SUPER_ADMIN_PHONE
        sync: false
      - key: SUPER_ADMIN_PIN
        sync: false
      - key: SUPER_ADMIN_NAME
        value: Super Admin

      # Logs
      - key: LOG_LEVEL
        value: info
